<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Playfair+Display:wght@500;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#070816;color:#f4eefb;font-family:'Lora',Georgia,'Times New Roman',serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 110%,#4a2a6e55,transparent 60%),radial-gradient(ellipse at 20% 0%,#1d2f7a44,transparent 55%)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1.2s}
.hide{opacity:0;pointer-events:none}
h1{font-family:'Dancing Script','Brush Script MT',cursive;font-size:clamp(1.9rem,7vw,3rem);font-weight:700;letter-spacing:.02em;color:#ffe3f1}
.amor{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(4.2rem,22vw,9rem);line-height:1;color:#fff;text-shadow:0 0 24px #ff7ac6,0 0 60px #b04bff88;animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 34px #ff9ad5,0 0 80px #b04bffcc}}
p.sub{margin-top:10px;opacity:.75}
#gift{font-size:6rem;background:none;border:0;cursor:pointer;margin:28px 0 10px;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 0 22px #ffb6e1aa)}
@keyframes float{50%{transform:translateY(-12px) scale(1.05)}}
#card{align-items:stretch;justify-content:flex-start;padding:max(24px,env(safe-area-inset-top)) 20px 20px}
#card header{text-align:center;margin-bottom:14px}
#card header h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(1.15rem,5.2vw,2rem);letter-spacing:.08em;color:#ffd6ec}
#card header small{opacity:.7}
#letter{flex:1;overflow-y:auto;max-width:640px;width:100%;margin:0 auto;text-align:left;line-height:1.75;font-size:1.08rem;padding:18px 20px;background:#ffffff0d;border:1px solid #ffffff22;border-radius:18px;backdrop-filter:blur(6px)}
#letter p{margin-bottom:1em}
#letter .end{text-align:right;color:#ffd6ec}
#love{display:none;margin-top:14px;font-size:2rem;letter-spacing:.2em;color:#ffb6e1;text-shadow:0 0 18px #ff7ac6}
#mute{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;background:#ffffff18;border:0;color:#fff;border-radius:50%;width:42px;height:42px;font-size:1.2rem;cursor:pointer;display:none}
.fc{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
#fw{pointer-events:none;z-index:0}
.bigheart{position:relative;width:min(80vw,400px);animation:beat 1.6s ease-in-out infinite;filter:drop-shadow(0 0 26px #ffffffaa)}
.bigheart svg{width:100%;display:block}
.bigheart .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12%;color:#d6336c;font-family:'Playfair Display',Georgia,serif;text-align:center}
.t .d{font-size:clamp(3rem,15vw,5.6rem);font-weight:700;line-height:1}
.t .m{font-size:clamp(1.1rem,5.4vw,2rem);letter-spacing:.14em;text-transform:uppercase}
.t .y{font-size:clamp(1.2rem,6vw,2.2rem);margin-top:2px}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.fin-title{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(2.4rem,10vw,4.2rem);margin-top:22px;color:#fff;text-shadow:0 0 22px #ff7ac6}
#next{display:none;margin:14px auto 0;background:linear-gradient(135deg,#ff7ac6,#b04bff);border:0;color:#fff;border-radius:26px;padding:12px 26px;font-family:inherit;font-size:1.05rem;cursor:pointer;box-shadow:0 0 24px #ff7ac688;animation:beat 1.6s ease-in-out infinite}
#back{margin-top:16px;background:#ffffff18;border:1px solid #ffffff44;color:#fff;border-radius:20px;padding:8px 18px;font-family:inherit;cursor:pointer}
.heart{position:fixed;bottom:-30px;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<canvas id="sky"></canvas><div class="glow"></div>
<div class="screen" id="intro">
  <div class="amor">Mi amor</div>
  <h1>Tengo una sorpresa para ti...</h1>
  <button id="gift" aria-label="Abrir regalo">🎁</button>
  <p class="sub">Toca el regalo para comenzar ✨</p>
</div>
<div class="screen hide" id="card">
  <header><h1>FELIZ CUMPLEAÑOS MYSHH 🤍</h1><small>2 de noviembre</small></header>
  <div id="letter"></div>
  <div id="love">TE AMO ❤️</div>
  <button id="next">Toca para continuar 💖</button>
</div>
<div class="screen hide" id="finale" style="background:rgba(7,8,22,.62);z-index:20">
  <canvas id="fw"></canvas>
  <div class="fc">
    <div class="bigheart">
      <svg viewBox="0 0 200 172" aria-hidden="true"><path fill="#fff" d="M100 170C20 110 0 70 0 45 0 18 20 0 48 0c22 0 42 12 52 32C110 12 130 0 152 0c28 0 48 18 48 45 0 25-20 65-100 125z"/></svg>
      <div class="t"><div class="d">2</div><div class="m">noviembre</div><div class="y">2005</div></div>
    </div>
    <div class="fin-title">Feliz cumpleaños mi amor 🤍</div>
    <button id="back">Volver a la carta</button>
  </div>
</div>
<button id="mute" aria-label="Sonido">🔊</button>
<audio id="music" src="musica.mp3" loop preload="auto"></audio>
<script>
// Cielo estrellado
const cv=document.getElementById('sky'),cx=cv.getContext('2d');let W,H,stars=[],shoot=null;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;stars=Array.from({length:Math.round(W*H/5000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,p:Math.random()*6.28,s:Math.random()*.02+.005}))}
addEventListener('resize',size);size();
(function draw(){cx.clearRect(0,0,W,H);
 for(const s of stars){s.p+=s.s;cx.globalAlpha=.4+.6*Math.abs(Math.sin(s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()}
 if(!shoot&&Math.random()<.004)shoot={x:Math.random()*W*.8,y:Math.random()*H*.4,l:0};
 if(shoot){cx.globalAlpha=1-shoot.l/60;cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x-40,shoot.y-18);cx.stroke();shoot.x+=14;shoot.y+=6;if(++shoot.l>60)shoot=null}
 requestAnimationFrame(draw)})();

// Carta
const text=[
"Hoy, 2 de noviembre, quiero detener un poquito el mundo para decirte lo que a veces se me queda corto en los chats.",
"Nos conocimos por un amigo, en medio de un juego, sin imaginar en lo que se iba a convertir. Y aunque hasta hoy no he podido verte en persona, sentí desde el principio que ya te conocía. Nuestra conversación siempre fluyó, y sin darme cuenta te volviste mi primer mensaje al despertar y mi última llamada antes de dormir.",
"Me haces reír hasta con tus siestas a mitad de un kdrama, con tu tecito caliente y con la forma en que cuentas cada cosa como si fuera una gran historia. Me encanta verte esforzarte tanto en tus estudios, y quiero que sepas que estoy muy orgulloso de ti.",
"Una vez dijiste que con nuestra historia se podría escribir una novela o un kdrama. Yo creo que sí, y que todavía estamos escribiendo el final.",
"Sé que ya no hablamos como antes, y que quizás hoy estamos mejor así, cada uno con su espacio para concentrarnos en nosotros mismos. Yo lo respeto, de verdad. Pero hablemos mucho o poco, pasemos tiempo juntos o no, nada de eso cambia lo más importante: te amo. Y quiero que hoy, en tu día, lo recuerdes.",
"Me prometiste que cuando nos conociéramos celebrarías mi cumpleaños. Hoy te prometo yo que, cuando llegue ese día, celebraremos todos los tuyos.",
"Que este nuevo año de vida te traiga calma, sueños cumplidos y muchas razones para sonreír. Gracias por existir y por ser mi lugar favorito, aunque sea a través de una pantalla.",
"Feliz cumpleaños, mi niña hermosa.",
"Con todo mi amor,<br>tu macaco ❤️"];
const box=document.getElementById('letter');let skip=false;
box.addEventListener('click',()=>skip=true);
const wait=ms=>new Promise(r=>setTimeout(r,skip?0:ms));
async function write(){
 for(let i=0;i<text.length;i++){
  const p=document.createElement('p');if(i===text.length-1)p.className='end';box.appendChild(p);
  if(i===text.length-1){p.innerHTML=text[i];}else{for(const ch of text[i]){p.textContent+=ch;await wait(28);box.scrollTop=box.scrollHeight}}
  box.scrollTop=box.scrollHeight;await wait(500);
 }
 document.getElementById('love').style.display='block';
 setInterval(heart,350);
 document.getElementById('next').style.display='block';
}
function heart(){const h=document.createElement('div');h.className='heart';h.textContent=['❤️','🤍','💖','✨'][Math.random()*4|0];h.style.left=Math.random()*100+'vw';h.style.fontSize=(14+Math.random()*20)+'px';h.style.animationDuration=(5+Math.random()*4)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),9000)}

// Fuegos artificiales
const fin=document.getElementById('finale'),fw=document.getElementById('fw'),fx=fw.getContext('2d');let parts=[],fwOn=false,fwTimer;
function burst(){const x=Math.random()*fw.width*.8+fw.width*.1,y=Math.random()*fw.height*.5+fw.height*.08,h=Math.random()*360;for(let i=0;i<70;i++){const a=6.283*i/70,v=Math.random()*4+1.5;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h})}}
function fwLoop(){if(!fwOn)return;fx.clearRect(0,0,fw.width,fw.height);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.vx*=.985;p.vy*=.985;p.l-=.012;fx.globalAlpha=Math.max(p.l,0);fx.fillStyle='hsl('+p.h+',100%,70%)';fx.beginPath();fx.arc(p.x,p.y,2.2,0,6.28);fx.fill()}parts=parts.filter(p=>p.l>0);requestAnimationFrame(fwLoop)}
function finale(){fw.width=innerWidth;fw.height=innerHeight;fin.classList.remove('hide');fwOn=true;fwLoop();burst();clearInterval(fwTimer);fwTimer=setInterval(burst,900)}
document.getElementById('next').addEventListener('click',finale);
document.getElementById('back').addEventListener('click',()=>{fin.classList.add('hide');fwOn=false;clearInterval(fwTimer)});

// Regalo + música
const music=document.getElementById('music'),mute=document.getElementById('mute');
document.getElementById('gift').addEventListener('click',()=>{
 music.volume=.7;music.play().catch(()=>{});
 mute.style.display='block';
 document.getElementById('intro').classList.add('hide');
 document.getElementById('card').classList.remove('hide');
 setTimeout(write,1200);
});
mute.addEventListener('click',()=>{music.muted=!music.muted;mute.textContent=music.muted?'🔇':'🔊'});
</script>
</body>
</html>
